services:
  backend:
    build: ./backend
    container_name: wyqy-backend
    ports:
      - "8000:8000"
    volumes:
      - wyqy-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/wyqy.db
      - HTTP_TIMEOUT=10
      - MAX_CONCURRENT_SCANS=5
      # --- AI 配置（未设置时可在前端设置页配置 DB 模型，优先于环境变量）---
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.1}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-2048}
      - AI_TIMEOUT=${AI_TIMEOUT:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: wyqy-frontend
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wyqy-data:
